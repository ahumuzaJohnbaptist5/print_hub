{% extends 'base.html' %}
{% block title %}Reset Password - PrintHub{% endblock %}
{% block content %}
<div class="relative min-h-[calc(100vh-4rem)] overflow-hidden flex items-center justify-center">
    <div class="absolute inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1557804506-669a67965ba0?w=1920&q=80" class="w-full h-full object-cover opacity-30" />
        <div class="absolute inset-0 bg-gradient-to-br from-slate-900/90 via-slate-900/70 to-slate-900/90"></div>
    </div>
    <div class="relative z-10 max-w-md w-full mx-4">
        <div class="bg-white/5 border border-white/10 backdrop-blur-md rounded-3xl p-8 shadow-2xl">
            <h2 class="text-2xl font-bold text-white text-center mb-4">Reset Your Password</h2>
            <p class="text-gray-400 text-sm text-center mb-6">Enter your email address and we'll send you a link to reset your password.</p>
            
            <form method="POST" class="space-y-6">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
                    <input type="email" name="email" autocomplete="email" class="w-full bg-white/10 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500" required />
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition-all">Send Reset Link</button>
            </form>
            <p class="text-center text-gray-400 text-sm mt-6">
                Remember your password? <a href="{% url 'login' %}" class="text-blue-400 hover:text-blue-300">Sign In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
