<!-- assistant/templates/assistant/widget.html -->
<div id="assistant-chat-widget" data-user-id="{{ user.id }}">
    <!-- Floating Action Button with Badge -->
    <button id="assistant-toggle" 
            class="fixed bottom-6 right-6 z-50 w-14 h-14 bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 text-white rounded-full shadow-lg flex items-center justify-center transition-all hover:scale-105 focus:outline-none focus:ring-4 focus:ring-indigo-500/50 group"
            aria-label="Open PrintHub Assistant">
        <svg class="w-7 h-7 group-hover:rotate-12 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
        </svg>
        <span class="absolute -top-1 -right-1 w-4 h-4 bg-green-400 rounded-full animate-pulse ring-2 ring-slate-900"></span>
        <span id="assistant-unread-badge" class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center hidden">0</span>
    </button>
</div>

<script>
    (function() {
        'use strict';
        
        const widget = document.getElementById('assistant-chat-widget');
        if (!widget) return;

        const toggleBtn = document.getElementById('assistant-toggle');
        if (!toggleBtn) return;

        let isOpen = false;
        let chatWindow = null;
        let chatHistory = [];
        let unreadCount = 0;
        let isFirstOpen = true;

        // Get CSRF token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');

        // ─── SESSION STORAGE ──────────────────────────────────

        function saveChatHistory() {
            try {
                sessionStorage.setItem('assistant_chat_history', JSON.stringify(chatHistory));
            } catch (e) {}
        }

        function loadChatHistory() {
            try {
                const saved = sessionStorage.getItem('assistant_chat_history');
                if (saved) {
                    chatHistory = JSON.parse(saved);
                    return true;
                }
            } catch (e) {}
            return false;
        }

        // ─── LINK DETECTION ────────────────────────────────────

        function linkifyText(text) {
            // URL detection
            let formatted = text.replace(
                /(https?:\/\/[^\s]+)/g,
                '<a href="$1" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:text-blue-300 underline break-all">$1</a>'
            );
            
            // WhatsApp number detection (wa.me links)
            formatted = formatted.replace(
                /(wa\.me\/[^\s]+)/g,
                '<a href="https://$1" target="_blank" rel="noopener noreferrer" class="text-green-400 hover:text-green-300 underline">$1</a>'
            );
            
            // Phone number detection (simple)
            formatted = formatted.replace(
                /(\+?256[0-9]{9})/g,
                '<a href="tel:$1" class="text-blue-400 hover:text-blue-300 underline">$1</a>'
            );
            
            return formatted;
        }

        function createChatWindow() {
            if (chatWindow) return chatWindow;

            chatWindow = document.createElement('div');
            chatWindow.id = 'assistant-chat-window';
            chatWindow.className = 'fixed bottom-24 right-6 z-50 w-80 sm:w-96 h-[560px] bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl flex flex-col overflow-hidden transition-all duration-300 transform origin-bottom-right';
            chatWindow.style.display = 'none';
            chatWindow.style.opacity = '0';
            chatWindow.style.transform = 'scale(0.9)';

            // ─── HEADER ──────────────────────────────────────────
            const header = document.createElement('div');
            header.className = 'bg-gradient-to-r from-blue-600 to-indigo-700 p-4 flex items-center justify-between flex-shrink-0';
            header.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
                        </svg>
                    </div>
                    <div>
                        <h3 class="text-white font-bold text-sm">PrintHub Assistant</h3>
                        <p class="text-blue-200 text-xs flex items-center gap-1">
                            <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span> Online
                            <span class="text-blue-300/50 mx-1">•</span>
                            <span class="text-blue-300/70 text-[10px]" id="assistant-time">Now</span>
                        </p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button id="assistant-minimize" class="text-white/60 hover:text-white transition text-sm hidden sm:block" title="Minimize">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/>
                        </svg>
                    </button>
                    <button id="assistant-close" class="text-white/80 hover:text-white transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
            `;
            chatWindow.appendChild(header);

            // ─── MESSAGES AREA ──────────────────────────────────
            const messages = document.createElement('div');
            messages.id = 'assistant-messages';
            messages.className = 'flex-1 p-4 overflow-y-auto space-y-3 bg-slate-800/50 scroll-smooth';
            messages.innerHTML = `
                <div class="flex gap-2 items-start">
                    <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold text-white shrink-0">AI</div>
                    <div class="bg-slate-700 text-slate-200 p-3 rounded-lg rounded-tl-none max-w-[85%] text-sm leading-relaxed">
                        👋 Hi! I'm the PrintHub Assistant. Need help with orders, pricing, or anything else?
                    </div>
                </div>
                <div class="flex flex-wrap gap-1.5 pl-10">
                    <button class="assistant-chip px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs rounded-full border border-slate-600 transition" data-command="My orders">📚 My orders</button>
                    <button class="assistant-chip px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs rounded-full border border-slate-600 transition" data-command="Pricing">💰 Pricing</button>
                    <button class="assistant-chip px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs rounded-full border border-slate-600 transition" data-command="Stations">📍 Stations</button>
                    <button class="assistant-chip px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs rounded-full border border-slate-600 transition" data-command="Start order">📤 Start order</button>
                    <button class="assistant-chip px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs rounded-full border border-slate-600 transition" data-command="Human">📞 Human</button>
                </div>
            `;
            chatWindow.appendChild(messages);

            // ─── TYPING INDICATOR ──────────────────────────────
            const typing = document.createElement('div');
            typing.id = 'assistant-typing';
            typing.className = 'hidden px-4 py-2 bg-slate-800/50';
            typing.innerHTML = `
                <div class="flex gap-2 items-center">
                    <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold text-white shrink-0">AI</div>
                    <div class="flex gap-1 bg-slate-700 p-3 rounded-lg rounded-tl-none">
                        <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0ms"></div>
                        <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 150ms"></div>
                        <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 300ms"></div>
                    </div>
                </div>
            `;
            chatWindow.appendChild(typing);

            // ─── SUGGESTIONS ────────────────────────────────────
            const suggestions = document.createElement('div');
            suggestions.id = 'assistant-suggestions';
            suggestions.className = 'hidden px-3 py-2 bg-slate-800/50 border-t border-slate-700 flex-shrink-0 flex flex-wrap gap-1.5';
            chatWindow.appendChild(suggestions);

            // ─── INPUT AREA ─────────────────────────────────────
            const inputArea = document.createElement('div');
            inputArea.className = 'p-3 bg-slate-900 border-t border-slate-700 flex-shrink-0';
            inputArea.innerHTML = `
                <form id="assistant-form" class="flex items-center gap-2">
                    <button type="button" id="assistant-upload-btn" class="p-2 text-gray-400 hover:text-white transition" title="Upload file">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
                        </svg>
                    </button>
                    <input type="file" id="assistant-file-input" class="hidden" accept=".pdf,.docx,.doc,.txt,.png,.jpg,.jpeg,.pptx">
                    <input type="text" id="assistant-input" placeholder="Type your message..." class="flex-1 bg-slate-800 text-white text-sm rounded-lg px-4 py-2 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent placeholder-gray-500">
                    <button type="submit" class="p-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                        </svg>
                    </button>
                </form>
                <div class="text-[10px] text-gray-500 mt-1 text-center hidden sm:block">
                    <kbd class="px-1.5 py-0.5 bg-slate-700 rounded">Enter</kbd> to send · <kbd class="px-1.5 py-0.5 bg-slate-700 rounded">Esc</kbd> to close
                </div>
            `;
            chatWindow.appendChild(inputArea);

            document.body.appendChild(chatWindow);

            // ─── EVENT LISTENERS ────────────────────────────────

            document.getElementById('assistant-close').addEventListener('click', toggleChat);
            
            const minimizeBtn = document.getElementById('assistant-minimize');
            if (minimizeBtn) {
                minimizeBtn.addEventListener('click', toggleChat);
            }

            const form = document.getElementById('assistant-form');
            const input = document.getElementById('assistant-input');
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const text = input.value.trim();
                if (text) {
                    addMessage(text, 'user');
                    input.value = '';
                    sendToAssistant(text);
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && isOpen) {
                    toggleChat();
                }
            });

            document.querySelectorAll('.assistant-chip').forEach(chip => {
                chip.addEventListener('click', function() {
                    const text = this.dataset.command || this.textContent.trim();
                    addMessage(text, 'user');
                    sendToAssistant(text);
                });
            });

            document.getElementById('assistant-upload-btn').addEventListener('click', function() {
                document.getElementById('assistant-file-input').click();
            });

            document.getElementById('assistant-file-input').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const size = (file.size / 1024).toFixed(1);
                addMessage(`📤 Uploading ${file.name} (${size} KB)...`, 'user');

                const formData = new FormData();
                formData.append('file', file);

                fetch('/api/assistant/upload/', {
                    method: 'POST',
                    headers: { 'X-CSRFToken': csrftoken },
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.text) {
                        addRichMessage(data, 'bot');
                    }
                })
                .catch(() => {
                    addMessage("❌ Upload failed. Please try again.", 'bot');
                });

                this.value = '';
            });

            // ─── THEME SUPPORT ──────────────────────────────────
            function updateTheme() {
                const isLight = document.documentElement.getAttribute('data-theme') === 'light';
                if (chatWindow) {
                    if (isLight) {
                        chatWindow.style.background = '#ffffff';
                        chatWindow.style.borderColor = '#cbd5e1';
                    } else {
                        chatWindow.style.background = '#1e293b';
                        chatWindow.style.borderColor = '#334155';
                    }
                }
            }
            const observer = new MutationObserver(updateTheme);
            observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
            updateTheme();

            if (loadChatHistory()) {
                chatHistory.forEach(msg => {
                    if (msg.role === 'user') {
                        addMessage(msg.content, 'user', true);
                    } else {
                        addMessage(msg.content, 'bot', true);
                    }
                });
            }

            function updateTime() {
                const now = new Date();
                const timeEl = document.getElementById('assistant-time');
                if (timeEl) {
                    timeEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                }
            }
            updateTime();
            setInterval(updateTime, 30000);

            return chatWindow;
        }

        function toggleChat() {
            const window = createChatWindow();
            isOpen = !isOpen;

            if (isOpen) {
                window.style.display = 'flex';
                setTimeout(() => {
                    window.style.opacity = '1';
                    window.style.transform = 'scale(1)';
                }, 10);
                document.getElementById('assistant-input')?.focus();
                const badge = document.getElementById('assistant-unread-badge');
                if (badge) {
                    badge.classList.add('hidden');
                    unreadCount = 0;
                }
                if (isFirstOpen) {
                    isFirstOpen = false;
                }
            } else {
                window.style.opacity = '0';
                window.style.transform = 'scale(0.9)';
                setTimeout(() => { window.style.display = 'none'; }, 300);
            }
        }

        // ─── MESSAGE HANDLER ──────────────────────────────────

        function addMessage(text, sender, silent = false) {
            const messages = document.getElementById('assistant-messages');
            if (!messages) return;

            const suggestions = document.getElementById('assistant-suggestions');
            if (sender === 'user') suggestions?.classList.add('hidden');

            const msgDiv = document.createElement('div');
            msgDiv.className = `flex gap-2 items-start ${sender === 'user' ? 'justify-end' : ''} animate-fadeIn`;

            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            if (sender === 'bot') {
                // Clean and linkify text
                const cleanText = text
                    .replace(/\*\*(.*?)\*\*/g, '<strong class="text-white">$1</strong>')
                    .replace(/\n/g, '<br>');
                const linkedText = linkifyText(cleanText);
                
                msgDiv.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold text-white shrink-0 mt-0.5">AI</div>
                    <div class="max-w-[85%]">
                        <div class="bg-slate-700 text-slate-200 p-3 rounded-lg rounded-tl-none text-sm leading-relaxed">${linkedText}</div>
                        <div class="text-[10px] text-gray-500 mt-1">${time}</div>
                    </div>
                `;
            } else {
                msgDiv.innerHTML = `
                    <div class="max-w-[85%]">
                        <div class="bg-indigo-600 text-white p-3 rounded-lg rounded-tr-none text-sm leading-relaxed">${text}</div>
                        <div class="text-[10px] text-gray-500 mt-1 text-right">${time}</div>
                    </div>
                `;
            }
            messages.appendChild(msgDiv);
            messages.scrollTop = messages.scrollHeight;

            if (!silent) {
                chatHistory.push({ role: sender, content: text, time: time });
                saveChatHistory();
            }

            if (!isOpen && sender === 'bot') {
                unreadCount++;
                const badge = document.getElementById('assistant-unread-badge');
                if (badge) {
                    badge.textContent = unreadCount;
                    badge.classList.remove('hidden');
                }
            }
        }

        // ─── RICH RESPONSE HANDLER ──────────────────────────────

        function addRichMessage(data, sender) {
            const messages = document.getElementById('assistant-messages');
            if (!messages) return;

            const suggestions = document.getElementById('assistant-suggestions');
            if (suggestions) suggestions.classList.add('hidden');

            const msgDiv = document.createElement('div');
            msgDiv.className = `flex gap-2 items-start ${sender === 'user' ? 'justify-end' : ''} animate-fadeIn`;

            let content = '';
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            if (data.data && data.data.type) {
                switch (data.data.type) {
                    case 'order':
                        content = renderOrderCard(data.data);
                        break;
                    case 'order_list':
                        content = renderOrderList(data.data);
                        break;
                    case 'pricing':
                        content = renderPricingTable(data.data);
                        break;
                    case 'stations':
                        content = renderStationList(data.data);
                        break;
                    case 'user_status':
                        content = renderStatusCard(data.data);
                        break;
                    case 'contact':
                        content = renderContactCard(data.data);
                        break;
                    case 'draft_summary':
                        content = renderDraftSummary(data.data);
                        break;
                    case 'welcome':
                        content = renderWelcomeCard(data.data);
                        break;
                    default:
                        content = renderText(data.text);
                }
            } else {
                content = renderText(data.text);
            }

            msgDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold text-white shrink-0 mt-0.5">AI</div>
                <div class="max-w-[85%]">
                    <div>${content}</div>
                    <div class="text-[10px] text-gray-500 mt-1">${time}</div>
                </div>
            `;
            messages.appendChild(msgDiv);
            messages.scrollTop = messages.scrollHeight;

            chatHistory.push({ role: 'bot', content: data.text || 'Response', time: time });
            saveChatHistory();

            if (data.suggestions && data.suggestions.length > 0) {
                showSuggestions(data.suggestions);
            }

            if (!isOpen) {
                unreadCount++;
                const badge = document.getElementById('assistant-unread-badge');
                if (badge) {
                    badge.textContent = unreadCount;
                    badge.classList.remove('hidden');
                }
            }
        }

        // ─── RENDER FUNCTIONS ────────────────────────────────────

        function renderText(text) {
            const cleanText = text
                .replace(/\*\*(.*?)\*\*/g, '<strong class="text-white">$1</strong>')
                .replace(/\n/g, '<br>');
            const linkedText = linkifyText(cleanText);
            return `<div class="bg-slate-700 text-slate-200 p-3 rounded-lg rounded-tl-none text-sm leading-relaxed">${linkedText}</div>`;
        }

        function renderWelcomeCard(data) {
            return `
                <div class="bg-gradient-to-br from-slate-700/50 to-slate-800/50 rounded-xl p-4 border border-slate-600">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-10 h-10 bg-indigo-500/20 rounded-full flex items-center justify-center text-xl">👋</div>
                        <div>
                            <div class="text-white font-bold text-sm">Welcome back!</div>
                            <div class="text-gray-400 text-xs">${data.name || 'Guest'}</div>
                        </div>
                    </div>
                    ${data.summary ? `
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="bg-slate-700/30 rounded-lg p-2 text-center">
                            <div class="text-gray-500">Orders</div>
                            <div class="text-white font-bold">${data.summary.total || 0}</div>
                        </div>
                        <div class="bg-slate-700/30 rounded-lg p-2 text-center">
                            <div class="text-gray-500">Ready</div>
                            <div class="text-green-400 font-bold">${data.summary.ready || 0}</div>
                        </div>
                    </div>
                    ` : ''}
                    <div class="mt-3 text-gray-400 text-xs">${data.announcement || ''}</div>
                </div>
            `;
        }

        function renderOrderCard(order) {
            const statusColors = {
                'pending': 'bg-yellow-500/20 text-yellow-400 border-yellow-500/30',
                'paid': 'bg-blue-500/20 text-blue-400 border-blue-500/30',
                'printing': 'bg-purple-500/20 text-purple-400 border-purple-500/30',
                'in_transit': 'bg-orange-500/20 text-orange-400 border-orange-500/30',
                'ready': 'bg-green-500/20 text-green-400 border-green-500/30',
                'collected': 'bg-gray-500/20 text-gray-400 border-gray-500/30',
                'cancelled': 'bg-red-500/20 text-red-400 border-red-500/30'
            };
            const statusColor = statusColors[order.status] || 'bg-gray-500/20 text-gray-400 border-gray-500/30';

            const statusSteps = ['pending', 'paid', 'printing', 'in_transit', 'ready', 'collected'];
            const currentStep = statusSteps.indexOf(order.status);
            const progress = currentStep >= 0 ? (currentStep / (statusSteps.length - 1) * 100) : 0;

            return `
                <div class="bg-slate-700/50 rounded-xl p-4 border border-slate-600 hover:border-slate-500 transition">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="text-white font-bold text-sm">Order #${order.id}</span>
                            <span class="text-gray-400 text-xs ml-2 break-all">${order.file_name || 'Document'}</span>
                        </div>
                        <span class="px-2 py-0.5 rounded-full text-xs font-semibold ${statusColor} border">
                            ${order.status_display || order.status}
                        </span>
                    </div>
                    <div class="w-full bg-slate-600 rounded-full h-1.5 mb-3">
                        <div class="bg-gradient-to-r from-indigo-500 to-purple-500 h-1.5 rounded-full transition-all duration-500" style="width: ${progress}%"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="bg-slate-700/30 rounded-lg p-2">
                            <span class="text-gray-500">Pages</span>
                            <span class="text-white block font-medium">${order.page_count || 0}</span>
                        </div>
                        <div class="bg-slate-700/30 rounded-lg p-2">
                            <span class="text-gray-500">Total</span>
                            <span class="text-green-400 block font-bold">${order.total_price || 0} UGX</span>
                        </div>
                        ${order.station ? `
                        <div class="bg-slate-700/30 rounded-lg p-2 col-span-2">
                            <span class="text-gray-500">📍 Station</span>
                            <span class="text-white block font-medium">${order.station}</span>
                        </div>
                        ` : ''}
                        ${order.time_left ? `
                        <div class="bg-slate-700/30 rounded-lg p-2 col-span-2">
                            <span class="text-gray-500">⏱ Time Left</span>
                            <span class="text-white block font-mono">${order.time_left}</span>
                        </div>
                        ` : ''}
                    </div>
                    ${order.status === 'pending' ? `
                    <div class="mt-3 pt-3 border-t border-slate-600">
                        <a href="/orders/${order.id}/payment/" 
                           class="block text-center bg-green-600 hover:bg-green-700 text-white text-xs font-bold py-2 rounded-lg transition">💳 Pay Now</a>
                    </div>
                    ` : ''}
                    ${order.status === 'ready' ? `
                    <div class="mt-3 pt-3 border-t border-slate-600">

                        <a href="/track/?order_id=${order.id}" 
                           class="flex-1 text-center bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] font-medium py-1.5 rounded-lg transition">📍 Track</a>
                        ${order.status === 'pending' || order.status === 'paid' ? `

                           class="flex-1 text-center bg-red-600/50 hover:bg-red-600 text-white text-[10px] font-medium py-1.5 rounded-lg transition">✕ Cancel</a>

        function renderOrderList(data) {
            const orders = data.orders || [];
            if (orders.length === 0) {
                return `<div class="bg-slate-700 text-slate-200 p-3 rounded-lg rounded-tl-none text-sm leading-relaxed">📭 No orders found.</div>`;
            }

            let html = `<div class="space-y-2 max-h-60 overflow-y-auto pr-1">`;
            orders.forEach(order => {
                const statusColors = {
                    'pending': 'bg-yellow-500/20 text-yellow-400',
                    'paid': 'bg-blue-500/20 text-blue-400',
                    'printing': 'bg-purple-500/20 text-purple-400',
                    'in_transit': 'bg-orange-500/20 text-orange-400',
                    'ready': 'bg-green-500/20 text-green-400',
                    'collected': 'bg-gray-500/20 text-gray-400',
                    'cancelled': 'bg-red-500/20 text-red-400'
                };
                const statusColor = statusColors[order.status] || 'bg-gray-500/20 text-gray-400';

                html += `
                    <div class="bg-slate-700/30 rounded-lg p-3 border border-slate-600/50 cursor-pointer hover:bg-slate-700/50 transition"
                         onclick="window.location.href='/track/?order_id=${order.id}'">
                        <div class="flex justify-between items-center">
                            <span class="text-white font-bold text-sm">#${order.id}</span>
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${statusColor} border border-transparent">
                                ${order.status_display || order.status}
                            </span>
                        </div>
                        <div class="flex justify-between text-xs mt-1">
                            <span class="text-gray-400 truncate max-w-[120px]">${order.file_name || 'Document'}</span>
                            <span class="text-white font-bold">${order.total_price || 0} UGX</span>
                        </div>
                        ${order.station ? `<div class="text-gray-500 text-xs mt-1">📍 ${order.station}</div>` : ''}
                        <div class="flex gap-2 mt-2">
                            <button onclick="event.stopPropagation(); window.location.href='/orders/${order.id}/receipt/'" 
                                    class="flex-1 text-center bg-slate-600 hover:bg-slate-500 text-white text-[10px] font-medium py-1 rounded transition">Receipt</button>
                            <button onclick="event.stopPropagation(); window.location.href='/track/?order_id=${order.id}'" 
                                    class="flex-1 text-center bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] font-medium py-1 rounded transition">Track</button>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            return html;
        }

        function renderPricingTable(data) {
            const prices = data.prices || [];
            if (prices.length === 0) {
                return `<div class="bg-slate-700 text-slate-200 p-3 rounded-lg rounded-tl-none text-sm leading-relaxed">💰 Pricing information not available.</div>`;
            }

            let html = `
                <div class="bg-slate-700/50 rounded-xl p-4 border border-slate-600">
                    <div class="text-white font-bold text-sm mb-3">💰 Pricing</div>
                    <div class="space-y-1.5">
            `;
            prices.forEach(item => {
                html += `
                    <div class="flex justify-between items-center border-b border-slate-600/30 pb-1.5">
                        <span class="text-gray-300 text-sm">${item.name}</span>
                        <span class="text-white font-bold text-sm">${item.price}</span>
                    </div>
                `;
            });
            html += `
                    </div>
                    ${data.discounts && data.discounts.length > 0 ? `
                    <div class="mt-3 pt-3 border-t border-slate-600">
                        <span class="text-green-400 text-xs font-semibold">🎫 Active: ${data.discounts.join(', ')}</span>
                    </div>
                    ` : ''}
                </div>
            `;
            return html;
        }

        function renderStationList(data) {
            const stations = data.stations || [];
            if (stations.length === 0) {
                return `<div class="bg-slate-700 text-slate-200 p-3 rounded-lg rounded-tl-none text-sm leading-relaxed">📍 No stations available.</div>`;
            }

            let html = `
                <div class="bg-slate-700/50 rounded-xl p-4 border border-slate-600">
                    <div class="text-white font-bold text-sm mb-3">📍 Stations</div>
                    <div class="space-y-2">
            `;
            stations.forEach(station => {
                html += `
                    <div class="flex justify-between items-center bg-slate-700/30 rounded-lg p-2.5">
                        <div>
                            <span class="text-white text-sm font-medium">${station.name}</span>
                            ${station.active_orders ? `<span class="text-gray-400 text-xs ml-2">${station.active_orders} active</span>` : ''}
                        </div>
                        <span class="text-green-400 text-xs">🟢 Open</span>
                    </div>
                `;
            });
            html += `
                    </div>
                </div>
            `;
            return html;
        }

        function renderStatusCard(data) {
            return `
                <div class="bg-slate-700/50 rounded-xl p-4 border border-slate-600">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-12 h-12 bg-gradient-to-br from-indigo-500 to-purple-500 rounded-full flex items-center justify-center text-white font-bold text-lg">
                            ${data.name ? data.name.charAt(0).toUpperCase() : 'U'}
                        </div>
                        <div>
                            <div class="text-white font-bold text-sm">${data.name || 'User'}</div>
                            <div class="text-gray-400 text-xs">${data.email || ''}</div>
                        </div>
                    </div>
                    ${data.stats ? `
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="bg-slate-700/30 rounded-lg p-2 text-center">
                            <div class="text-gray-500">Orders</div>
                            <div class="text-white font-bold">${data.stats.total || 0}</div>
                        </div>
                        <div class="bg-slate-700/30 rounded-lg p-2 text-center">
                            <div class="text-gray-500">Pending</div>
                            <div class="text-yellow-400 font-bold">${data.stats.pending || 0}</div>
                        </div>
                        <div class="bg-slate-700/30 rounded-lg p-2 text-center">
                            <div class="text-gray-500">Ready</div>
                            <div class="text-green-400 font-bold">${data.stats.ready || 0}</div>
                        </div>
                        <div class="bg-slate-700/30 rounded-lg p-2 text-center">
                            <div class="text-gray-500">Completed</div>
                            <div class="text-blue-400 font-bold">${data.stats.completed || 0}</div>
                        </div>
                    </div>
                    ` : ''}
                    ${data.role ? `<div class="mt-2 text-gray-400 text-xs">🎭 ${data.role}</div>` : ''}
                </div>
            `;
        }

        function renderContactCard(data) {
            const number = data.whatsapp_number || '+256791046296';
            const link = data.whatsapp_link || `https://wa.me/${number.replace('+', '')}`;
            const name = data.name || 'PrintHub Support';
            const type = data.contact_type || 'support';
            
            const icon = type === 'agent' ? '🏢' : '👤';
            const label = type === 'agent' ? 'Station Agent' : 'Support Team';
            
            return `
                <div class="bg-slate-700/50 rounded-xl p-4 border border-slate-600">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-10 h-10 bg-green-500/20 rounded-full flex items-center justify-center text-xl">${icon}</div>
                        <div>
                            <div class="text-white font-bold text-sm">${label}</div>
                            <div class="text-gray-400 text-xs">${name}</div>
                        </div>
                    </div>
                    ${data.station ? `<div class="text-gray-400 text-xs mb-2">📍 ${data.station}</div>` : ''}
                    <div class="bg-slate-700/30 rounded-lg p-3 mb-3">
                        <div class="text-gray-400 text-xs">WhatsApp</div>
                        <a href="tel:${number}" class="text-white font-mono text-sm hover:text-green-400 transition">${number}</a>
                    </div>
                    <a href="${link}" target="_blank" rel="noopener noreferrer"
                       class="block text-center bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-xl transition transform hover:scale-[1.02]">
                        💬 Open WhatsApp
                    </a>
                    <div class="flex justify-center gap-4 mt-2 text-gray-500 text-[10px]">
                        <span>⏰ Response: 5-30 min</span>
                        <span>🟢 Online</span>
                    </div>
                </div>
            `;
        }

        function renderDraftSummary(data) {
            const draft = data.draft || {};
            const hasFile = draft.has_file || false;
            
            return `
                <div class="bg-slate-700/50 rounded-xl p-4 border border-slate-600">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="text-lg">📝</span>
                        <span class="text-white font-bold text-sm">Your Draft</span>
                        ${hasFile ? '<span class="px-2 py-0.5 bg-green-500/20 text-green-400 text-[10px] rounded-full border border-green-500/30">✅ File ready</span>' : '<span class="px-2 py-0.5 bg-yellow-500/20 text-yellow-400 text-[10px] rounded-full border border-yellow-500/30">⚠️ No file</span>'}
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2 text-sm">
                        <div class="bg-slate-700/30 rounded-lg p-2">
                            <span class="text-gray-500 text-[10px]">Pages</span>
                            <div class="text-white font-bold">${draft.pages || '--'}</div>
                        </div>
                        <div class="bg-slate-700/30 rounded-lg p-2">
                            <span class="text-gray-500 text-[10px]">Type</span>
                            <div class="text-white">${draft.is_color ? '🎨 Color' : '⚫ B&W'}</div>
                        </div>
                        <div class="bg-slate-700/30 rounded-lg p-2">
                            <span class="text-gray-500 text-[10px]">Sides</span>
                            <div class="text-white">${draft.is_double_sided ? 'Double' : 'Single'}</div>
                        </div>
                        <div class="bg-slate-700/30 rounded-lg p-2">
                            <span class="text-gray-500 text-[10px]">Binding</span>
                            <div class="text-white">${draft.binding ? draft.binding.title() : 'None'}</div>
                        </div>
                        ${draft.station ? `
                        <div class="bg-slate-700/30 rounded-lg p-2 col-span-2">
                            <span class="text-gray-500 text-[10px]">Station</span>
                            <div class="text-white">${draft.station}</div>
                        </div>
                        ` : ''}
                        <div class="bg-slate-700/30 rounded-lg p-2 col-span-2">
                            <span class="text-gray-500 text-[10px]">Estimated Total</span>
                            <div class="text-green-400 font-bold">${draft.total ? draft.total.toLocaleString() + ' UGX' : '--'}</div>
                        </div>
                    </div>
                    
                    ${!hasFile ? `
                    <div class="mt-3 pt-3 border-t border-slate-600">
                        <button onclick="document.getElementById('assistant-file-input').click()" 
                                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold py-2 rounded-lg transition">
                            📎 Upload File
                        </button>
                    </div>
                    ` : `
                    <div class="mt-3 pt-3 border-t border-slate-600 flex gap-2">
                        <button onclick="window.location.href='/upload/'" 
                                class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2 rounded-lg transition">📤 Go to Upload</button>
                        <button onclick="window.location.href='/track/?order_id=' + document.querySelector('[data-order-id]')?.dataset?.orderId || ''" 
                                class="flex-1 bg-slate-600 hover:bg-slate-500 text-white text-xs font-bold py-2 rounded-lg transition">📍 Track</button>
                    </div>
                    `}
                </div>
            `;
        }

        function showSuggestions(suggestionsList) {
            const container = document.getElementById('assistant-suggestions');
            if (!container) return;

            if (!suggestionsList || suggestionsList.length === 0) {
                container.classList.add('hidden');
                return;
            }

            container.innerHTML = suggestionsList.map(s => {
                if (s === 'Open WhatsApp' || s.includes('WhatsApp')) {
                    return `<button class="suggestion-chip px-3 py-1.5 bg-green-600 hover:bg-green-700 text-white text-xs rounded-full border border-green-500 transition font-medium">💬 ${s}</button>`;
                }
                return `<button class="suggestion-chip px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs rounded-full border border-slate-600 transition">${s}</button>`;
            }).join('');

            container.querySelectorAll('.suggestion-chip').forEach(chip => {
                chip.addEventListener('click', function() {
                    const text = this.textContent.trim();
                    addMessage(text, 'user');
                    sendToAssistant(text);
                });
            });

            container.classList.remove('hidden');
        }

        // ─── REAL API CALL ──────────────────────────────────────

        async function sendToAssistant(message) {
            const typing = document.getElementById('assistant-typing');
            if (typing) typing.classList.remove('hidden');

            try {
                const response = await fetch('/api/assistant/chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken
                    },
                    body: JSON.stringify({
                        message: message,
                        context: window.location.pathname,
                        history: chatHistory.slice(-5)
                    })
                });

                const data = await response.json();
                typing?.classList.add('hidden');

                if (response.ok) {
                    if (data.data && data.data.type) {
                        addRichMessage(data, 'bot');
                    } else {
                        addMessage(data.text || "I'm not sure how to respond.", 'bot');
                    }
                    if (data.suggestions) showSuggestions(data.suggestions);
                } else {
                    addMessage("⚠️ Sorry, I encountered an error. Please try again.", 'bot');
                }
            } catch (error) {
                typing?.classList.add('hidden');
                addMessage("⚠️ Network error. Please check your connection.", 'bot');
                console.error('Chat error:', error);
            }
        }

        // ─── CLOSE ON OUTSIDE CLICK ─────────────────────────────

        document.addEventListener('click', function(e) {
            if (isOpen && chatWindow) {
                if (!chatWindow.contains(e.target) && e.target !== toggleBtn && !toggleBtn.contains(e.target)) {
                    toggleChat();
                }
            }
        });

        toggleBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleChat();
        });

        console.log('🎨 PrintHub Assistant Widget Loaded');
        console.log('📋 Commands: Help, My orders, Track #id, Pricing, Stations, Start order, Human, Templates');
        
        // ─── ADD ANIMATION STYLES ──────────────────────────────
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(6px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .animate-fadeIn {
                animation: fadeIn 0.25s ease-out;
            }
        `;
        document.head.appendChild(style);
        
    })();
</script>
