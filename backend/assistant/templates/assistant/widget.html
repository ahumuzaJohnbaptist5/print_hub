<!-- assistant/templates/assistant/widget.html -->
<div id="assistant-chat-widget" data-user-id="{{ user.id }}">
    <!-- Floating Action Button -->
    <button id="assistant-toggle" 
            class="fixed bottom-6 right-6 z-50 w-14 h-14 bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 text-white rounded-full shadow-lg flex items-center justify-center transition-all hover:scale-105 focus:outline-none focus:ring-4 focus:ring-indigo-500/50"
            aria-label="Open PrintHub Assistant">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
        </svg>
    </button>
</div>

<script>
    (function() {
        'use strict';
        
        const widget = document.getElementById('assistant-chat-widget');
        if (!widget) return;

        const toggleBtn = document.getElementById('assistant-toggle');
        if (!toggleBtn) return;

        let isOpen = false;
        let chatWindow = null;

        // Get CSRF token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');

        function createChatWindow() {
            if (chatWindow) return chatWindow;

            chatWindow = document.createElement('div');
            chatWindow.id = 'assistant-chat-window';
            chatWindow.className = 'fixed bottom-24 right-6 z-50 w-80 sm:w-96 h-[500px] bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl flex flex-col overflow-hidden transition-all duration-300 transform origin-bottom-right';
            chatWindow.style.display = 'none';
            chatWindow.style.opacity = '0';
            chatWindow.style.transform = 'scale(0.9)';

            // Header
            const header = document.createElement('div');
            header.className = 'bg-gradient-to-r from-blue-600 to-indigo-700 p-4 flex items-center justify-between flex-shrink-0';
            header.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
                        </svg>
                    </div>
                    <div>
                        <h3 class="text-white font-bold text-sm">PrintHub Assistant</h3>
                        <p class="text-blue-200 text-xs flex items-center gap-1">
                            <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span> Online now
                        </p>
                    </div>
                </div>
                <button id="assistant-close" class="text-white/80 hover:text-white transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            `;
            chatWindow.appendChild(header);

            // Messages area
            const messages = document.createElement('div');
            messages.id = 'assistant-messages';
            messages.className = 'flex-1 p-4 overflow-y-auto space-y-4 bg-slate-800/50';
            messages.innerHTML = `
                <div class="flex gap-2 items-start">
                    <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold text-white shrink-0">AI</div>
                    <div class="bg-slate-700 text-slate-200 p-3 rounded-lg rounded-tl-none max-w-[80%] text-sm">
                        👋 Hi! I'm the PrintHub Assistant. Need help with an order or want a quick price quote?
                    </div>
                </div>
                <div class="flex flex-wrap gap-2 pl-10">
                    <button class="assistant-chip px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs rounded-full border border-slate-600 transition">📍 Track my order</button>
                    <button class="assistant-chip px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs rounded-full border border-slate-600 transition">💰 Get a price quote</button>
                    <button class="assistant-chip px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs rounded-full border border-slate-600 transition">📞 Talk to human</button>
                </div>
            `;
            chatWindow.appendChild(messages);

            // Typing indicator
            const typing = document.createElement('div');
            typing.id = 'assistant-typing';
            typing.className = 'hidden px-4 py-2 bg-slate-800/50';
            typing.innerHTML = `
                <div class="flex gap-2 items-center">
                    <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold text-white shrink-0">AI</div>
                    <div class="flex gap-1 bg-slate-700 p-3 rounded-lg rounded-tl-none">
                        <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0ms"></div>
                        <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 150ms"></div>
                        <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 300ms"></div>
                    </div>
                </div>
            `;
            chatWindow.appendChild(typing);

            // Input area
            const inputArea = document.createElement('div');
            inputArea.className = 'p-3 bg-slate-900 border-t border-slate-700 flex-shrink-0';
            inputArea.innerHTML = `
                <form id="assistant-form" class="flex items-center gap-2">
                    <input type="text" id="assistant-input" placeholder="Type your message..." class="flex-1 bg-slate-800 text-white text-sm rounded-lg px-4 py-2 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    <button type="submit" class="p-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                        </svg>
                    </button>
                </form>
            `;
            chatWindow.appendChild(inputArea);

            // Add to DOM
            document.body.appendChild(chatWindow);

            // Event listeners
            const closeBtn = document.getElementById('assistant-close');
            if (closeBtn) closeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleChat();
            });

            const form = document.getElementById('assistant-form');
            const input = document.getElementById('assistant-input');
            if (form && input) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const text = input.value.trim();
                    if (text) {
                        addMessage(text, 'user');
                        input.value = '';
                        sendToAssistant(text);
                    }
                });
            }

            // Quick chips
            document.querySelectorAll('.assistant-chip').forEach(chip => {
                chip.addEventListener('click', function() {
                    const text = this.textContent.trim();
                    addMessage(text, 'user');
                    sendToAssistant(text);
                });
            });

            // Light theme support
            function updateTheme() {
                const isLight = document.documentElement.getAttribute('data-theme') === 'light';
                if (chatWindow) {
                    if (isLight) {
                        chatWindow.classList.add('light-theme');
                        chatWindow.style.background = '#ffffff';
                        chatWindow.style.borderColor = '#cbd5e1';
                    } else {
                        chatWindow.classList.remove('light-theme');
                        chatWindow.style.background = '#1e293b';
                        chatWindow.style.borderColor = '#334155';
                    }
                }
            }

            // Listen for theme changes
            const observer = new MutationObserver(updateTheme);
            observer.observe(document.documentElement, { 
                attributes: true, 
                attributeFilter: ['data-theme'] 
            });
            updateTheme();

            return chatWindow;
        }

        function toggleChat() {
            const window = createChatWindow();
            isOpen = !isOpen;
            
            if (isOpen) {
                window.style.display = 'flex';
                setTimeout(() => {
                    window.style.opacity = '1';
                    window.style.transform = 'scale(1)';
                }, 10);
                const input = document.getElementById('assistant-input');
                if (input) setTimeout(() => input.focus(), 200);
            } else {
                window.style.opacity = '0';
                window.style.transform = 'scale(0.9)';
                setTimeout(() => {
                    window.style.display = 'none';
                }, 300);
            }
        }

        function addMessage(text, sender) {
            const messages = document.getElementById('assistant-messages');
            if (!messages) return;

            const msgDiv = document.createElement('div');
            msgDiv.className = `flex gap-2 items-start ${sender === 'user' ? 'justify-end' : ''}`;
            
            if (sender === 'bot') {
                msgDiv.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold text-white shrink-0">AI</div>
                    <div class="bg-slate-700 text-slate-200 p-3 rounded-lg rounded-tl-none max-w-[80%] text-sm">${text}</div>
                `;
            } else {
                msgDiv.innerHTML = `
                    <div class="bg-indigo-600 text-white p-3 rounded-lg rounded-tr-none max-w-[80%] text-sm">${text}</div>
                `;
            }
            messages.appendChild(msgDiv);
            messages.scrollTop = messages.scrollHeight;
        }

        async function sendToAssistant(message) {
            const typing = document.getElementById('assistant-typing');
            if (typing) typing.classList.remove('hidden');

            try {
                const response = await fetch('/api/assistant/chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken
                    },
                    body: JSON.stringify({ 
                        message: message,
                        context: window.location.pathname
                    })
                });

                const data = await response.json();
                
                if (typing) typing.classList.add('hidden');
                
                if (response.ok) {
                    addMessage(data.text || "I'm not sure how to respond to that.", 'bot');
                } else {
                    addMessage("⚠️ Sorry, I encountered an error. Please try again.", 'bot');
                }
            } catch (error) {
                if (typing) typing.classList.add('hidden');
                addMessage("⚠️ Network error. Please check your connection.", 'bot');
                console.error('Chat error:', error);
            }
        }

        // Click outside to close
        document.addEventListener('click', function(e) {
            if (isOpen && chatWindow) {
                const toggleBtn = document.getElementById('assistant-toggle');
                if (!chatWindow.contains(e.target) && e.target !== toggleBtn && !toggleBtn.contains(e.target)) {
                    toggleChat();
                }
            }
        });

        // Open/close on toggle
        toggleBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleChat();
        });

        console.log('🤖 PrintHub Assistant Widget Loaded');
    })();
</script>

<style>
    /* Light theme support for chat */
    html[data-theme="light"] #assistant-chat-window {
        background: #ffffff !important;
        border-color: #cbd5e1 !important;
        box-shadow: 0 10px 40px rgba(0,0,0,0.15) !important;
    }
    html[data-theme="light"] #assistant-messages {
        background: #f8fafc !important;
    }
    html[data-theme="light"] #assistant-messages .bg-slate-700 {
        background: #ffffff !important;
        color: #1e293b !important;
        border: 1px solid #e2e8f0 !important;
    }
    html[data-theme="light"] #assistant-messages .bg-slate-700 .text-slate-200 {
        color: #1e293b !important;
    }
    html[data-theme="light"] #assistant-typing .bg-slate-700 {
        background: #ffffff !important;
        border: 1px solid #e2e8f0 !important;
    }
    html[data-theme="light"] #assistant-typing .bg-slate-400 {
        background: #94a3b8 !important;
    }
    html[data-theme="light"] .assistant-chip {
        background: #f1f5f9 !important;
        color: #1e293b !important;
        border-color: #cbd5e1 !important;
    }
    html[data-theme="light"] .assistant-chip:hover {
        background: #e2e8f0 !important;
    }
    html[data-theme="light"] #assistant-form input {
        background: #f1f5f9 !important;
        color: #1e293b !important;
        border-color: #cbd5e1 !important;
    }
    html[data-theme="light"] #assistant-form input::placeholder {
        color: #94a3b8 !important;
    }
    html[data-theme="light"] #assistant-form .p-3 {
        background: #ffffff !important;
        border-color: #e2e8f0 !important;
    }
</style>
