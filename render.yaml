services:
  - type: web
    name: printhub
    env: python
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate --noinput
      python manage.py collectstatic --noinput
    startCommand: gunicorn core.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.9"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com,printhub.onrender.com,printhub.onderd.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://printhub.onrender.com,https://printhub.onderd.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,http://localhost:8000,https://print-hub-sigma.vercel.app,https://printhub.onrender.com,https://printhub.onderd.com"
      - key: SITE_URL
        value: "https://printhub.onrender.com"
      - key: RATELIMIT_ENABLE
        value: "True"